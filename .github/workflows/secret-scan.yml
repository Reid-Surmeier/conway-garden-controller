# Source: agentic-workflow/hooks/staged-secrets/secret-scan.yml (issue #561).
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanner
        shell: bash
        run: |
          set -euo pipefail
          scan_tools=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")
          curl --disable --fail --silent --show-error --location --max-time 60 --proto '=https' --proto-redir '=https' \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o "$scan_tools/gitleaks.tgz"
          printf '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  %s\n' "$scan_tools/gitleaks.tgz" | sha256sum --check --status
          tar -xzf "$scan_tools/gitleaks.tgz" -C "$scan_tools" gitleaks
          echo "$scan_tools" >> "$GITHUB_PATH"
      - name: Scan candidate changes and tree
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if test -n "$BASE" && test "$BASE" != 0000000000000000000000000000000000000000; then
            gitleaks git . --log-opts="$BASE..HEAD" --redact=100 --no-banner
          fi
          gitleaks dir . --redact=100 --no-banner
